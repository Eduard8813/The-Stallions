spring.application.name=wani connect

# Credenciales de la base de datos: se leen obligatoriamente de variables de entorno.
# Ejemplos para definirlas antes de iniciar la app:
#   Windows PowerShell:
#     $env:SPRING_DATASOURCE_URL="jdbc:sqlserver://HOST:1433;databaseName=DB;encrypt=true;trustServerCertificate=true"
#     $env:SPRING_DATASOURCE_USERNAME="usuario"
#     $env:SPRING_DATASOURCE_PASSWORD="clave"
#   Unix/macOS:
#     export SPRING_DATASOURCE_URL="jdbc:sqlserver://HOST:1433;databaseName=DB;encrypt=true;trustServerCertificate=true"
#     export SPRING_DATASOURCE_USERNAME="usuario"
#     export SPRING_DATASOURCE_PASSWORD="clave"
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Secreto HMAC de los tokens JWT (minimo 32 caracteres). Requerido en produccion.
jwt.secret=${JWT_SECRET:my-super-secret-key-change-this-in-production-min-32-chars}
jwt.expiration-ms=3600000

# Tiempo máximo de inactividad de una sesión (minutos) antes de expirarla.
# El filtro JWT rechaza peticiones con sesiones vencidas y un scheduler
# las marca como inactivas en la base de datos.
app.session.max-inactivity-minutes=720

firebase.credentials-path=firebase-credentials.json

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Base URL pública del backend, usada para construir la URL de la foto de perfil.
# Si no se define, se toma del host de la petición.
app.base-url=

# Credenciales del panel de administración (/admin/**).
# Requeridas; definirlas como APP_ADMIN_USERNAME / APP_ADMIN_PASSWORD.
app.admin.username=${APP_ADMIN_USERNAME}
app.admin.password=${APP_ADMIN_PASSWORD}